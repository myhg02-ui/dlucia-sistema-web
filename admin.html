<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administrador | D'Lucia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17201d;--v:#1f3a34;--v2:#2b4d45;--b:#b08d57;--bg:#f1f3ef;--line:#d8ddd6;--bad:#b4402f;--ok:#2f7a4f;--r:8px}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600}[hidden]{display:none!important}
button,input,select{font:inherit}:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btn{background:var(--v);color:#fff;border:0;padding:9px 16px;border-radius:var(--r);font-weight:700;cursor:pointer;transition:.2s}.btn:hover{background:var(--v2);transform:translateY(-1px)}
.btn.s{padding:5px 10px;font-size:.85rem}.btn.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.d{background:var(--bad)}
input,select{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-width:0}
#login{min-height:100vh;display:grid;place-items:center;background:var(--v);padding:20px}
#login form{background:#fff;padding:36px;border-radius:12px;width:min(380px,100%);display:grid;gap:14px;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
#login h1{font-size:1.7rem}#login small{color:#5a6762}.err{color:var(--bad);min-height:1.4em;font-weight:500}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--v);color:#e8eeea;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h2{font-size:1.25rem;padding:0 10px 18px;color:#fff}aside h2 span{color:var(--b)}
.nav{background:none;border:0;color:inherit;text-align:left;padding:11px 12px;border-radius:var(--r);cursor:pointer;transition:.2s;font-weight:500}
.nav:hover{background:rgba(255,255,255,.09)}.nav.on{background:var(--b);color:#17201d;font-weight:700}
.sp{flex:1}aside a{color:#c9d3cd;font-size:.85rem;padding:6px 12px}
main{padding:28px 32px;max-width:1100px;width:100%}main>section{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}.top h1{font-size:1.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;border-top:3px solid var(--b)}.k b{display:block;font:600 2.2rem Fraunces,serif;color:var(--v)}.k.al b{color:var(--bad)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}.box h3{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.row input,.row select{flex:1 1 130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.82rem;color:#5a6762}
tr.new{animation:flash 1.6s}@keyframes flash{from{background:#f3e6cc}to{background:none}}
.tg{padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:#e3efe7;color:var(--ok)}.tg.bad{background:#f7e0db;color:var(--bad)}.tg.w{background:#f3e6cc;color:#7a5a1f}
.bar{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;margin:9px 0}.bar i{display:block;height:12px;border-radius:6px;background:var(--b);width:0;transition:width 1s ease}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);transform:translateY(90px);opacity:0;transition:.35s;z-index:9}.toast.show{transform:none;opacity:1}.toast.bad{background:var(--bad)}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside h2{width:100%;padding-bottom:6px}.sp{display:none}main{padding:18px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.th{width:56px;height:42px;object-fit:cover;border-radius:6px;display:block;cursor:pointer;transition:opacity .2s}.th:hover{opacity:.85}.th.ph{background:#dfe4dc}.hint{color:#5a6762;font-size:.9rem;margin-bottom:12px}
.th-wrap{position:relative;display:inline-block;width:56px;height:42px;vertical-align:middle}
.th.empty{background:#edf2ec;border:1.5px dashed #b7c2b5;display:flex;align-items:center;justify-content:center;color:#496156;font-size:.75rem;font-weight:700;text-decoration:none}
.th.empty:hover{background:#dfe8dd;border-color:var(--v);color:var(--v)}
.th-del{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;border:1.5px solid #fff;cursor:pointer;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s}
.th-del:hover{transform:scale(1.2)}
[data-en],[data-eni],[data-epi]{cursor:pointer;transition:color .15s}
[data-en]:hover,[data-eni]:hover,[data-epi]:hover{color:var(--v);text-decoration:underline}
</style></head><body>
<div id="login"><form id="lf"><h1>D'Lucia · Administrador</h1><small>Ingresa con tu usuario y contraseña.</small>
<input id="u" placeholder="Usuario" autocomplete="username" required><input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<p class="err" id="le"></p><button class="btn">Ingresar</button><small>Usuarios: gerente o admin | Contraseña: dlucia2026</small></form></div>
<div id="app" hidden>
<aside><h2>D'Lucia <span>Admin</span></h2>
<button class="nav on" data-v="dash">Resumen</button><button class="nav" data-v="inv">Inventario</button><button class="nav" data-v="ped">Pedidos</button><button class="nav" data-v="cli">Clientes</button><button class="nav" data-v="web">Catálogo web</button><button class="nav" data-v="promo">Promociones</button>
<div class="sp"></div><a href="index.html">Ver página pública</a><button class="nav" id="out">Cerrar sesión</button></aside>
<main id="v"></main></div><div class="toast" id="toast_box"></div>
<script>
const $=s=>document.querySelector(s),ST=['Registrado','En fabricación','Listo para entrega','Entregado'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};const S={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const seed=()=>({prod:[
{c:'MU-001',n:'Sofá 3 cuerpos terciopelo',cat:'Salas',u:'und',p:1249,s:6,m:3},
{c:'MU-002',n:'Sillón individual nórdico',cat:'Salas',u:'und',p:650,s:4,m:2},
{c:'CA-001',n:'Cama con cabecera tapizada',cat:'Descanso',u:'und',p:980,s:3,m:2},
{c:'CO-001',n:'Colchón ortopédico 2 plazas',cat:'Descanso',u:'und',p:780,s:5,m:3},
{c:'CB-001',n:'Cabecera capitoné a medida',cat:'A medida',u:'und',p:420,s:4,m:2},
{c:'MU-003',n:'Sofá seccional modular',cat:'Salas',u:'und',p:1890,s:3,m:2},
{c:'TE-001',n:'Tela terciopelo verde bosque',cat:'Telas',u:'m',p:28,s:45,m:20},
{c:'ES-001',n:'Espuma zebra D20 (plancha)',cat:'Espumas',u:'plancha',p:95,s:2,m:5}],
cli:[
{d:'90009911',n:'Andre Mateo Romero',t:'952999569',em:'andre.mateo@gmail.com',k:'CLIENTE'},
{d:'45871236',n:'María Quispe Huamán',t:'987654321',em:'maria.quispe@gmail.com',k:'CLIENTE'},
{d:'20601234567',n:'Tapicería Los Andes S.A.C.',t:'955123456',em:'contacto@tapicerialosandes.pe',k:'CLIENTE'},
{d:'-',n:'Juan Pérez Alva',t:'988776655',em:'juan.perez@hotmail.com',k:'POTENCIAL'}],
ped:[
{id:'PED-1001',c:'Andre Mateo Romero',d:'Sofá 3 cuerpos terciopelo verde bosque con patas de madera cedro',st:0,f:'2026-10-22'},
{id:'PED-1002',c:'María Quispe Huamán',d:'Juego de cama con cabecera capitoné tapizada en lino gris',st:1,f:'2026-10-18'},
{id:'PED-1003',c:'Tapicería Los Andes S.A.C.',d:'Lote de 10 planchas de espuma zebra D20 y 30m de tela chenille',st:2,f:'2026-10-14'},
{id:'PED-1004',c:'Juan Pérez Alva',d:'Sillón individual nórdico en tela color mostaza',st:3,f:'2026-10-12'}],
mov:[
{f:'11/10/2026, 08:30:00',c:'TE-001',t:'Entrada',q:45},
{f:'11/10/2026, 09:15:00',c:'ES-001',t:'Salida',q:8},
{f:'11/10/2026, 10:00:00',c:'MU-001',t:'Entrada',q:3}]});
if(S.get('dl_ver')!=='v2_presentacion'){try{localStorage.removeItem('dl_admin');S.set('dl_ver','v2_presentacion')}catch(e){}}
let D=JSON.parse(S.get('dl_admin')||'null')||seed();const save=()=>S.set('dl_admin',JSON.stringify(D));
let view='dash';
function toast(m,bad){const t=$('#toast_box');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',4500)}
// Login (R-01 y RF-45: autenticación contra usuario de MySQL)
$('#lf').onsubmit=async e=>{
  e.preventDefault();
  const lock=+S.get('dl_lock')||0;
  if(Date.now()<lock)return $('#le').textContent='Cuenta bloqueada. Intenta en '+Math.ceil((lock-Date.now())/60000)+' min.';
  const u=$('#u').value.trim(), p=$('#p').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if(data.ok) {
      S.set('dl_fail',0);
      S.set('dl_ses', JSON.stringify(data.usuario));
      enter();
      return;
    } else {
      $('#le').textContent = data.error || 'Credenciales incorrectas';
    }
  } catch(err) {
    if((u==='admin'||u==='gerente') && (p==='dlucia2026'||p==='root')){
      S.set('dl_fail',0);S.set('dl_ses','1');enter();return;
    }
  }
  const f=(+S.get('dl_fail')||0)+1;
  S.set('dl_fail',f);
  if(f>=3){S.set('dl_lock',Date.now()+9e5);S.set('dl_fail',0);$('#le').textContent='3 intentos fallidos: cuenta bloqueada 15 minutos (R-01).'}
  else $('#le').textContent='Datos incorrectos. Intento '+f+' de 3.';
};
function enter(){$('#login').hidden=true;$('#app').hidden=false;go('dash')}
$('#out').onclick=()=>{S.set('dl_ses','');location.reload()};
document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,flash){view=v;document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#v').innerHTML='<section>'+R[v]()+'</section>';bind(v);if(flash){const r=document.querySelector('[data-k="'+flash+'"]');r&&r.classList.add('new')}}
const tag=(t,c)=>`<span class="tg ${c||''}">${t}</span>`;
const R={
dash(){
  const low=D.prod.filter(p=>p.s<=p.m),act=D.ped.filter(o=>o.st<3).length,cnt=ST.map((s,i)=>D.ped.filter(o=>o.st===i).length),mx=Math.max(1,...cnt);
  return `<div class="top"><h1>Panel de control</h1></div><div class="kpis">
<div class="k"><b id="kpi_prod" data-n="${D.prod.length}">0</b>Productos</div><div class="k ${low.length?'al':''}"><b id="kpi_low" data-n="${low.length}">0</b>Con stock bajo</div>
<div class="k"><b id="kpi_act" data-n="${act}">0</b>Pedidos activos</div><div class="k"><b id="kpi_cli" data-n="${D.cli.length}">0</b>Clientes</div></div>
<div class="two"><div class="box"><h3>Pedidos por estado</h3>${ST.map((s,i)=>`<div class="bar"><span>${s}</span><i data-w="${cnt[i]/mx*100}"></i><b>${cnt[i]}</b></div>`).join('')}</div>
<div class="box"><h3>Alertas de reposición</h3>${low.length?low.map(p=>`<p>${tag('Stock bajo','bad')} ${esc(p.n)}: ${p.s} (mínimo ${p.m})</p>`).join(''):'<p>Sin alertas. Todo el stock está sobre su mínimo.</p>'}</div></div>
<div class="box"><h3>Últimos movimientos</h3>${D.mov.length?D.mov.slice(-5).reverse().map(m=>`<p>${m.f} · ${esc(m.c)} · ${m.t} ${m.q}</p>`).join(''):'<p>Sin movimientos recientes registrados.</p>'}</div>`},
inv(){
  return `<div class="top"><h1>Inventario y productos</h1><input id="q" placeholder="Buscar producto o código"></div>
<div class="box"><h3>Registrar nuevo producto</h3>
<div class="row">
  <input id="c" placeholder="Código (ej. SOF-002)">
  <input id="n" placeholder="Nombre comercial">
  <select id="ln" title="Línea de negocio"><option value="MUEBLES">Muebles</option><option value="MATERIALES_TAPICERIA">Materiales Tapicería</option></select>
  <input id="cat" placeholder="Categoría (Salas, Telas...)">
  <select id="u" title="Unidad de medida"><option value="UNIDAD">UNIDAD</option><option value="METRO">METRO</option><option value="PLANCHA">PLANCHA</option><option value="KILOGRAMO">KILOGRAMO</option><option value="JUEGO">JUEGO</option></select>
  <input id="p" type="number" min="0" step="0.01" placeholder="Precio venta S/">
  <input id="m" type="number" min="0" placeholder="Stock mínimo">
  <button class="btn" id="add">Guardar producto</button>
</div></div>
<div class="box tw"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Stock</th><th>Mínimo</th><th>Precio vigente</th><th>Estado</th><th>Movimiento</th></tr></thead><tbody id="tb"></tbody></table></div>`},
ped(){
  return `<div class="top"><h1>Gestión de pedidos</h1></div><div class="box"><h3>Registrar nuevo pedido</h3><div class="row"><select id="pc">${D.cli.map(c=>`<option value="${esc(c.n)}">${esc(c.n)}</option>`).join('')}</select><input id="pd" placeholder="Descripción (medidas, tela, acabados)"><input id="pf" type="date"><button class="btn" id="add">Registrar</button></div></div>
<div class="box tw"><table><thead><tr><th>N.º</th><th>Cliente</th><th>Detalle</th><th>Entrega</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tb_ped"></tbody></table></div>`},
cli(){
  return `<div class="top"><h1>Directorio de clientes</h1></div><div class="box"><h3>Registrar nuevo cliente</h3>
<div class="row">
  <input id="cli_doc" placeholder="DNI (8 dígitos) o RUC (11 dígitos)" inputmode="numeric">
  <input id="cli_nom" placeholder="Nombre completo o razón social">
  <input id="cli_tel" placeholder="Teléfono" inputmode="numeric">
  <input id="cli_em" placeholder="Correo (opcional)" type="email">
  <select id="cli_tipo"><option value="POTENCIAL">Potencial cliente</option><option value="CLIENTE">Cliente formal</option></select>
  <button class="btn" id="btnAddCli">Guardar cliente</button>
</div></div>
<div class="box tw"><table><thead><tr><th>Documento</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Clasificación</th></tr></thead><tbody id="tb_cli"></tbody></table></div>`}
};
async function rows(){
  const q=($('#q')?.value||'').toLowerCase();
  try {
    const res = await fetch('/api/productos');
    const json = await res.json();
    if(json.ok && json.data) {
      D.prod = json.data.map(p=>({id:p.id_producto, c:p.codigo, n:p.nombre, cat:p.categoria, u:p.unidad_medida, p:p.precio_venta, s:Number(p.stock_actual), m:Number(p.stock_minimo)}));
      save();
    }
  } catch(e) {}
  $('#tb').innerHTML=D.prod.filter(p=>(p.c+p.n).toLowerCase().includes(q)).map(p=>`<tr data-k="${p.c}">
    <td>${esc(p.c)}</td>
    <td><strong data-eni="${p.id||p.c}" data-n="${esc(p.n)}" title="Clic para corregir nombre">${esc(p.n)}</strong></td>
    <td>${p.cat}</td>
    <td><b>${p.s}</b> ${esc(p.u)}</td>
    <td>${p.m}</td>
    <td><strong data-epi="${p.id||p.c}" data-n="${esc(p.n)}" data-pr="${p.p}" title="Clic para cambiar precio">S/ ${(+p.p).toFixed(2)}</strong></td>
    <td>${p.s<=p.m?tag('Stock bajo','bad'):tag('Disponible')}</td>
    <td><button class="btn s" data-a="in" data-i="${p.c}">+ Entrada</button> <button class="btn s o" data-a="out" data-i="${p.c}">− Salida</button></td>
  </tr>`).join('');
  document.querySelectorAll('[data-epi]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.epi, nombre=b.dataset.n, actual=b.dataset.pr||'';
    const nuevo=prompt(`Cambiar precio de venta de "${nombre}" (en S/):`, actual);
    if(nuevo===null) return;
    const num=parseFloat(nuevo);
    if(isNaN(num)||num<=0) return toast('Ingresa un precio válido mayor a 0.', 1);
    try {
      const res=await fetch('/api/productos/'+id+'/precio', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ precio: num })
      });
      const d=await res.json();
      if(d.ok){
        toast(`Precio de "${nombre}" actualizado a S/ ${num.toFixed(2)}`);
        rows();
      } else toast(d.error||'Error al actualizar', 1);
    }catch(e){toast('Error de conexión', 1);}
  });
  document.querySelectorAll('[data-eni]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.eni, actual=b.dataset.n;
    const nuevo=prompt(`Corregir nombre del producto:`, actual);
    if(!nuevo||!nuevo.trim()||nuevo.trim()===actual) return;
    try {
      const res=await fetch('/api/productos/'+id, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ nombre: nuevo.trim() })
      });
      const d=await res.json();
      if(d.ok){
        toast(`Nombre actualizado a "${nuevo.trim()}"`);
        rows();
      } else toast(d.error||'Error al actualizar nombre', 1);
    }catch(e){toast('Error de conexión', 1);}
  });
}
async function loadCli(){
  try {
    const res = await fetch('/api/clientes');
    const json = await res.json();
    if(json.ok && json.data) {
      D.cli = json.data.map(c=>({d:c.numero_documento||'-', n:c.nombres_razon_social, t:c.telefono, em:c.correo||'-', k:c.clasificacion}));
      save();
    }
  } catch(e) {}
  const tb = $('#tb_cli');
  if(tb) {
    tb.innerHTML = D.cli.map(c=>{
      const esFormal = (c.k === 'CLIENTE' || c.k === 'Cliente');
      const etiqueta = esFormal ? 'Cliente formal' : 'Potencial cliente';
      const clase = esFormal ? '' : 'w';
      return `<tr data-k="${c.d}"><td>${c.d}</td><td>${esc(c.n)}</td><td>${esc(c.t)}</td><td>${esc(c.em||'-')}</td><td>${tag(etiqueta, clase)}</td></tr>`;
    }).join('');
  }
}
async function loadPed(){
  const mapSt = s => {
    if(!s) return 0;
    const u = String(s).toUpperCase().replace(/\s+/g, '_');
    if(u.includes('FABRIC')) return 1;
    if(u.includes('LISTO')) return 2;
    if(u === 'ENTREGADO') return 3;
    return 0;
  };
  try {
    const res = await fetch('/api/pedidos');
    const json = await res.json();
    if(json.ok && json.data) {
      D.ped = json.data.map(p=>({id:p.numero, c:p.cliente, d:p.detalle, f:(p.fecha_comprometida||'').slice(0,10), st:mapSt(p.estado)}));
      save();
    }
  } catch(e) {}
  const tb = $('#tb_ped');
  if(tb) {
    if(D.ped.length === 0) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:22px;color:#7d8582">No hay pedidos registrados aún. Ingresa los datos arriba y presiona "Registrar".</td></tr>';
    } else {
      tb.innerHTML = D.ped.map(o=>`<tr data-k="${o.id}">
        <td>${o.id}</td>
        <td>${esc(o.c)}</td>
        <td>${esc(o.d)}</td>
        <td>${o.f||'-'}</td>
        <td>${tag(ST[o.st]||'Registrado',o.st===3?'':(o.st===2?'ok':'w'))}</td>
        <td>
          ${o.st > 0 ? `<button class="btn s o" data-a="ret" data-i="${o.id}" title="Regresar al estado anterior">↶ Regresar</button> ` : ''}
          ${o.st < 3 ? `<button class="btn s" data-a="adv" data-i="${o.id}" title="Avanzar al siguiente estado">Avanzar</button> ` : ''}
          ${o.st < 2 ? `<button class="btn s d" data-a="del" data-i="${o.id}">Anular</button>` : ''}
        </td>
      </tr>`).join('');
    }
  }
  bindPedActions();
}
function bindPedActions(){
  document.querySelectorAll('#tb_ped [data-a]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.i;

const img2url=(f,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.onerror=()=>toast('No se pudo leer la imagen.',1);i.src=r.result};r.readAsDataURL(f)};

R.web=()=>`<div class="top"><h1>Catálogo web</h1><a class="btn o" href="index.html" target="_blank">Ver página pública</a></div>

async function loadWebProds(){
  try {
    const res = await fetch('/api/productos/todos');
    const json = await res.json();
    if(json.ok && json.data) {
      webProds = json.data;
    }
  } catch(e) {}
  // Cargar y vincular switch de mostrar precios
  try {
    const resCfg = await fetch('/api/configuracion');
    const jsonCfg = await resCfg.json();
    if(jsonCfg.ok && jsonCfg.config) {
      const chk = $('#cfg_precios'), lbl = $('#cfg_precios_label');
      if(chk && lbl) {
        chk.checked = !!jsonCfg.config.mostrar_precios;
        lbl.textContent = chk.checked ? 'Activado (Muestra precios)' : 'Desactivado (Solo cotización)';
        chk.onchange = async () => {
          try {
            await fetch('/api/configuracion', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ mostrar_precios: chk.checked })
            });
            lbl.textContent = chk.checked ? 'Activado (Muestra precios)' : 'Desactivado (Solo cotización)';
            toast(chk.checked ? 'Precios activados en la web pública.' : 'Precios desactivados en la web pública.');
          } catch(err) {
            toast('Error al guardar configuración', 1);
          }
        };
      }
    }
  } catch(err){}
  const tb = $('#tb_web');
  if(tb) {
    tb.innerHTML = webProds.map(p=>`<tr>
      <td>
        ${p.imagen ? `
          <div class="th-wrap">
            <img class="th" src="${p.imagen}" alt="" data-ph="${p.id_producto}" title="Clic para cambiar foto">
            <button class="th-del" data-df="${p.id_producto}" data-n="${esc(p.nombre)}" title="Quitar foto">✕</button>
          </div>
        ` : `
          <div class="th-wrap">
            <span class="th empty" data-ph="${p.id_producto}" title="Clic para subir foto">+ Foto</span>
          </div>
        `}
      </td>
      <td><strong data-en="${p.id_producto}" data-n="${esc(p.nombre)}" title="Clic para corregir nombre">${esc(p.nombre)}</strong><br><small style="color:#5a6762">${esc(p.codigo)}</small></td>
      <td>${esc(cl(p.categoria))}</td>
      <td><strong>${p.precio_venta && Number(p.precio_venta) > 0 ? 'S/ ' + Number(p.precio_venta).toFixed(2) : 'Sin precio'}</strong></td>
      <td style="text-align:center"><label style="cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px"><input type="checkbox" data-t="${p.id_producto}" ${p.activo ? 'checked' : ''}> ${p.activo ? '<span style="color:var(--b)">Visible</span>' : '<span style="color:#888">Oculto</span>'}</label></td>
    </tr>`).join('');
    bindWebActions();
  }
}

function bindWebActions(){
  document.querySelectorAll('[data-t]').forEach(c=>c.onchange=async()=>{
    const id = c.dataset.t;
    try {
      const res = await fetch('/api/productos/' + id + '/toggle', { method: 'POST' });
      const json = await res.json();
      if(json.ok) {
        toast(c.checked ? 'Producto visible en el catálogo.' : 'Producto oculto del catálogo.');
      } else {
        toast('Error al actualizar visibilidad', 1);
      }
    } catch(e) {
      toast('Error de conexión', 1);
    }
    loadWebProds();
  });

  // Corregir nombre de producto
  document.querySelectorAll('[data-en]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.en, actual=b.dataset.n;
    const nuevo=prompt(`Corregir nombre del producto:`, actual);
    if(!nuevo||!nuevo.trim()||nuevo.trim()===actual) return;
    try {
      const res=await fetch('/api/productos/'+id, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ nombre: nuevo.trim() })
      });
      const d=await res.json();
      if(d.ok){
        toast(`Nombre actualizado a "${nuevo.trim()}"`);
        loadWebProds();
      } else toast(d.error||'Error al actualizar nombre', 1);
    }catch(e){toast('Error de conexión', 1);}
  });


  // Eliminar / quitar foto
  document.querySelectorAll('[data-df]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id = b.dataset.df;
    const nombre = b.dataset.n;
    if(!confirm(`¿Eliminar la foto de "${nombre}" y volver al dibujo original?`)) return;
    try {
      const res = await fetch('/api/productos/' + id + '/foto', { method: 'DELETE' });
      const d = await res.json();
      if(d.ok) {
        toast(`Foto de "${nombre}" eliminada.`);
        loadWebProds();
      } else {
        toast(d.error || 'Error al eliminar foto', 1);
      }
    } catch(err) {
      toast('Error de conexión', 1);
    }
  });

  let rid;
  document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{
    rid = b.dataset.ph;
    $('#rf').click();
  });
  $('#rf').onchange = e => {
    const f = e.target.files[0];
    if(f && rid) {
      img2url(f, async u => {
        try {
          await fetch('/api/productos/' + rid + '/foto', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ imagen: u })
          });
          toast('Foto actualizada con éxito.');
          loadWebProds();
        } catch(err) {
          toast('Error al guardar foto', 1);
        }
      });
    }
  };
}

async function loadPromos(){
  const hoy=new Date().toISOString().slice(0,10);
  try {
    const res = await fetch('/api/promociones');
    const json = await res.json();
    if(json.ok && json.data) {
      W.promo = json.data.map(x=>({id:x.id_promocion, t:x.titulo, d:x.descripcion, pc:x.porcentaje_descuento, u:(x.fecha_limite||'').slice(0,10), on:x.activa}));
      saveW();
    }
  } catch(e) {}
  const tb = $('#tb_promo');

    tb.innerHTML = W.promo.map(x=>`<tr><td>${esc(x.t)}</td><td>${x.pc}%</td><td>${x.u||'Sin fecha'}</td><td>${x.u&&x.u<hoy?tag('Vencida','bad'):tag('Vigente')}</td><td><input type="checkbox" data-pa="${x.id}" ${x.on?'checked':''} aria-label="Activa"></td><td><button class="btn s d" data-pr="${x.id}">Eliminar</button></td></tr>`).join('');
    bindPromoButtons();
  }

function bindPromoButtons(){

    loadPromos();
  });
  document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Eliminar esta promoción?')) return;
    try {
      await fetch('/api/promociones/'+b.dataset.pr, {method:'DELETE'});
      toast('Promoción eliminada con éxito.');
    } catch(e) {}
    loadPromos();
  });
}
